{% extends "captain/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="login"><section class="card"><div class="card__head"><h2>Choose a new password</h2></div><div class="card__body">
  <form method="post" novalidate>{% csrf_token %}{% include "partials/form_errors.html" %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Save password</button></form>
</div></section></div>
{% endblock %}
